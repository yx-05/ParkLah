<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ParkLah - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        body {
            font-family: 'Lexend', sans-serif;
            background-color: #f7fafa; /* bg-surface */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#d7dadb",
                        "inverse-surface": "#2d3132",
                        "primary": "#00535b",
                        "on-surface-variant": "#3e494a",
                        "surface-container-high": "#e6e9e9",
                        "surface": "#f7fafa",
                        "on-secondary-container": "#2b6d76",
                        "surface-container-highest": "#e0e3e3",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f1f4f4",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001f23",
                        "surface-ice": "#f2fbfe",
                        "on-tertiary-fixed": "#301400",
                        "primary-fixed-dim": "#82d3de",
                        "tertiary-fixed": "#ffdcc5",
                        "outline-variant": "#bec8ca",
                        "surface-bright": "#f7fafa",
                        "on-background": "#181c1d",
                        "surface-tint": "#006972",
                        "on-error-container": "#93000a",
                        "outline": "#6f797a",
                        "primary-fixed": "#9ff0fb",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-error": "#ffffff",
                        "on-primary-container": "#9becf7",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e0e3e3",
                        "secondary": "#23676f",
                        "on-secondary-fixed-variant": "#004f56",
                        "error-container": "#ffdad6",
                        "tertiary": "#713d10",
                        "secondary-fixed": "#adedf7",
                        "on-tertiary-fixed-variant": "#6d390c",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#82d3de",
                        "tertiary-container": "#8e5426",
                        "inverse-on-surface": "#eef1f2",
                        "primary-container": "#006d77",
                        "action-blue": "#007bff",
                        "star-gold": "#ffb400",
                        "on-secondary-fixed": "#001f23",
                        "secondary-fixed-dim": "#91d1da",
                        "secondary-container": "#adedf7",
                        "surface-container": "#ebeeef",
                        "on-tertiary-container": "#ffd7bd",
                        "background": "#f7fafa",
                        "on-primary-fixed-variant": "#004f56",
                        "on-surface": "#181c1d",
                        "stormy-teal": "#006d77",
                        "pearl-aqua": "#83c5be"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "margin-mobile": "20px",
                        "nav-height": "72px",
                        "stack-lg": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Lexend"],
                        "body-md": ["Lexend"],
                        "label-md": ["Lexend"],
                        "label-sm": ["Lexend"],
                        "body-lg": ["Lexend"],
                        "headline-md": ["Lexend"],
                        "label-lg": ["Lexend"],
                        "headline-sm": ["Lexend"],
                        "headline-lg-mobile": ["Lexend"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-sm": ["10px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "18px", "fontWeight": "600" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->

<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile py-stack-lg overflow-y-auto w-full max-w-md mx-auto justify-center pt-24">
<div class="mb-10 text-center">
<h1 class="font-bold text-stormy-teal text-[40px] mb-6 text-center">ParkLah</h1><h1 class="font-headline-lg-mobile text-headline-lg-mobile text-stormy-teal mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your parking.</p>
</div>
<form action="#" class="space-y-stack-md flex flex-col" method="POST">
<!-- Email/Phone Input -->
<div class="relative">
<label class="sr-only" for="email">Email or Phone</label>
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary-container focus:bg-surface transition-all font-body-lg text-body-lg text-on-surface placeholder-outline-variant shadow-sm" id="email" name="email" placeholder="Email or Phone" required="" type="text">
</div>
<!-- Password Input -->
<div class="relative">
<label class="sr-only" for="password">Password</label>
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary-container focus:bg-surface transition-all font-body-lg text-body-lg text-on-surface placeholder-outline-variant shadow-sm" id="password" name="password" placeholder="Password" required="" type="password">
<div class="absolute inset-y-0 right-0 pr-4 flex items-center">
<button class="text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex justify-end pt-2">
<a class="font-label-md text-label-md text-stormy-teal hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<!-- Primary Action Button -->
<div class="pt-6 pb-4 flex justify-center w-full">
<button class="w-3/4 py-4 rounded-full bg-pearl-aqua text-stormy-teal font-label-lg text-label-lg uppercase tracking-[0.15em] hover:opacity-90 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2" type="submit">
                    LOGIN
                    <span class="material-symbols-outlined text-[18px]">chevron_right</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="relative py-6 flex items-center w-full max-w-sm mx-auto">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 px-4 font-label-md text-label-md text-outline-variant">Or login with</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-4 w-full max-w-xs mx-auto">
<button class="w-full flex items-center justify-center gap-3 py-3 rounded-full border border-outline-variant/30 bg-surface shadow-sm hover:bg-surface-variant transition-colors text-on-surface font-label-md text-label-md">
<!-- Generic placeholder icon for Google -->
<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                Continue with Google
            </button>
<button class="w-full flex items-center justify-center gap-3 py-3 rounded-full border border-outline-variant/30 bg-surface shadow-sm hover:bg-surface-variant transition-colors text-on-surface font-label-md text-label-md">
<!-- Generic placeholder icon for Facebook -->
<svg class="w-5 h-5" fill="#1877F2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path></svg>
                Continue with Facebook
            </button>
</div>
<!-- Footer Link -->
<div class="mt-auto pt-10 pb-4 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-lg text-label-lg text-stormy-teal hover:underline ml-1" href="#">Sign Up</a>
</p>
</div>
</main>
<!-- Suppressed BottomNav because intent is transactional (Login) -->


</body></html>
